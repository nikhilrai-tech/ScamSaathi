[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "scamsaathi-engine"
version = "0.1.1"
description = "Offline, explainable scam-message detection for India (Hindi, Hinglish, English). The engine behind ScamSaathi."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = ["scam", "fraud", "phishing", "india", "hindi", "upi", "security", "offline"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Natural Language :: Hindi",
  "Natural Language :: English",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/nikhilrai-tech/ScamSaathi"
Issues = "https://github.com/nikhilrai-tech/ScamSaathi/issues"
Changelog = "https://github.com/nikhilrai-tech/ScamSaathi/blob/main/CHANGELOG.md"

[project.scripts]
scamsaathi = "scamsaathi.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pyflakes", "build"]

[tool.setuptools]
packages = ["scamsaathi"]

[tool.setuptools.package-data]
scamsaathi = ["data/pack.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
