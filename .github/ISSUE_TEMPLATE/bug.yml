name: Bug report
description: Something in the app, API or tools does not work
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Please do not paste real messages, phone numbers or personal data."
  - type: dropdown
    id: part
    attributes:
      label: Which part?
      options: ["Android app", "Web demo", "Python engine", "API", "Tools / CI", "Docs"]
    validations: {required: true}
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations: {required: true}
  - type: input
    id: env
    attributes:
      label: Version and device
      placeholder: "v0.1.0, Android 14, Redmi Note 11"
