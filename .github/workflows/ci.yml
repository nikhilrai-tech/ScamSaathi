name: tests
on: [push, pull_request]
permissions:
  contents: read  # least privilege: tests never need to write to the repository
jobs:
  engine:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e "engine[dev]"
      - run: python -m pyflakes engine/scamsaathi engine/tests
      - run: python -m pytest -q engine
  api:
    runs-on: ubuntu-latest
    env:
      SCAMSAATHI_SECRET_KEY: ci-only-not-a-secret
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r api/requirements.txt pyflakes
      - run: python -m pyflakes api tools
      - run: python api/manage.py makemigrations --check --dry-run
      - run: python api/manage.py test
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # third-party action: pinned to a commit, not a movable tag (v2.23.0)
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: "3.47.4"
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: app
      - run: flutter analyze
        working-directory: app
      - run: flutter test
        working-directory: app
