name: pages
# Publishes the web build of the app as a live demo: https://nikhilrai-tech.github.io/ScamSaathi/
# It is the same engine and screens as the phone app and runs entirely in the browser; nothing is sent to a server.
on:
  push:
    branches: [main]
    paths: ["app/**", "packs/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2  # v2.23.0, pinned to a commit
        with: {flutter-version: "3.47.4", channel: stable, cache: true}
      - run: flutter pub get && flutter build web --release --base-href /ScamSaathi/
        working-directory: app
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with: {path: app/build/web}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
