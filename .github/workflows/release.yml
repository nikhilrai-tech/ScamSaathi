name: release
# Push a tag like v0.1.0 to build and publish: the Android APK, the web demo, the Python package, the API image on GHCR,
# and a GitHub Release with checksums. The build jobs also run on pull requests that touch this file, publishing nothing.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths: [".github/workflows/release.yml", "Dockerfile", "app/android/**", "engine/pyproject.toml"]
permissions:
  contents: read
env:
  FLUTTER_ACTION: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2  # v2.23.0, pinned to a commit
jobs:
  checks:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        name: Tag, engine and app versions must agree
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' engine/pyproject.toml)"; fi
          ENGINE="$(sed -n 's/^version = "\(.*\)"/\1/p' engine/pyproject.toml)"
          APP="$(sed -n 's/^version: \([0-9.]*\)+.*/\1/p' app/pubspec.yaml)"
          echo "tag/version=$VERSION engine=$ENGINE app=$APP"
          [ "$VERSION" = "$ENGINE" ] && [ "$VERSION" = "$APP" ] || { echo "::error::versions differ"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  apk:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with: {flutter-version: "3.47.4", channel: stable, cache: true}
      - run: flutter pub get && flutter analyze && flutter test
        working-directory: app
      # Signed with the DEBUG key: fine for trying the app, not for the Play Store. A real release key is a maintainer secret.
      # one APK per CPU type (about a third of the size of a universal APK): arm64-v8a suits most phones of the last ~8 years
      - run: flutter build apk --release --split-per-abi --build-name "${{ needs.checks.outputs.version }}"
        working-directory: app
      - run: |
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "app/build/app/outputs/flutter-apk/app-$abi-release.apk" "ScamSaathi-${{ needs.checks.outputs.version }}-$abi-test.apk"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with: {name: apk, path: "ScamSaathi-*-test.apk"}

  web:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with: {flutter-version: "3.47.4", channel: stable, cache: true}
      - run: flutter pub get && flutter build web --release --no-web-resources-cdn --base-href /ScamSaathi/
        working-directory: app
      - run: cd app/build/web && zip -qr "../../../ScamSaathi-${{ needs.checks.outputs.version }}-web-demo.zip" .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with: {name: web, path: "ScamSaathi-*-web-demo.zip"}

  python:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.12"}
      - run: pip install build
      - run: python -m build engine --outdir dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with: {name: python, path: dist/*}

  image:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          IMAGE="ghcr.io/${OWNER}/scamsaathi-api"
          docker build -t "$IMAGE:${{ needs.checks.outputs.version }}" -t "$IMAGE:latest" .
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            docker push "$IMAGE:${{ needs.checks.outputs.version }}"
            docker push "$IMAGE:latest"
          else
            echo "not a tag: image built but not pushed"
          fi

  release:
    if: github.ref_type == 'tag'
    needs: [checks, apk, web, python, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with: {path: out, merge-multiple: true}
      - name: Notes from CHANGELOG.md
        run: |
          V="${{ needs.checks.outputs.version }}"
          awk -v v="$V" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "::error::CHANGELOG.md has no section for $V"; exit 1; }
          cat >> notes.md <<EOF

          ---
          **Install**
          - Android (test build, signed with a debug key): download the \`arm64-v8a\` \`.apk\` (most phones; \`armeabi-v7a\` for older ones), allow "install unknown apps" for your browser, open it. Check it against \`SHA256SUMS\` first.
          - Web demo: https://${GITHUB_REPOSITORY_OWNER}.github.io/ScamSaathi/
          - Python: \`pipx install scamsaathi-engine\` (once published on PyPI) or install the attached wheel.
          - API: \`docker pull ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/scamsaathi-api:$V\`
          EOF
      - run: cd out && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - run: gh release create "$GITHUB_REF_NAME" out/* --prerelease --title "ScamSaathi $GITHUB_REF_NAME" --notes-file notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  pypi:
    # Skipped until the repository variable PUBLISH_TO_PYPI is "true" and a trusted publisher exists on pypi.org
    # (project scamsaathi-engine, owner nikhilrai-tech, repo ScamSaathi, workflow release.yml, environment pypi).
    if: github.ref_type == 'tag' && vars.PUBLISH_TO_PYPI == 'true'
    needs: [python, release]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with: {name: python, path: dist}
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
